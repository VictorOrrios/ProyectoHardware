signal void resetGame(void)
{
	int i;
	portOn(16);
	for(i=0; i<2; i++)
	{
		portOff(14);
		portOff(15);
		swatch(0.015);
		portOn(14);
		portOn(15);
		swatch(0.015);
	}
	portOff(14);
	portOff(15);
	swatch(3.5);
	for(i=0; i<2; i++)
	{
		portOff(14);
		portOff(15);
		swatch(0.015);
		portOn(14);
		portOn(15);
		swatch(0.015);
	}
}

DEFINE BUTTON "Button 1 PUSH", "portPush14()"
