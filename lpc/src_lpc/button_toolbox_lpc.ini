FUNC void portOn(int pin)
{
	PORT |= 1<<pin;
}

FUNC void portOff(int pin)
{
	PORT &= ~(1<<pin);
}

FUNC void portToggle(int pin)
{
	PORT ^= 1<<pin;
}


signal void portPush14(void)
{
	int i;
	for(i=0; i<2; i++)
	{
		portOff(14);
		swatch(0.015);
		portOn(14);
		swatch(0.015);
	}
	portOff(14);
	swatch(0.15);
	portOn(14);
	for(i=0; i<2; i++)
	{
		portOff(14);
		swatch(0.015);
		portOn(14);
		swatch(0.015);
	}
	portOn(14);
}

